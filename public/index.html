<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Sasa Loan</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="center-page">
    <div class="wrap narrow">
      <div class="hero-card" style="margin-bottom:16px;">
        <div class="eyebrow">Sasa Loan</div>
        <h1 style="margin:0;">Money that moves with you.</h1>
        <p class="muted">Manage your loan securely, wherever you are.</p>
      </div>
      <div class="panel">
        <h2 style="margin-top:0;">Sign in</h2>
        <p class="muted">Use your member or staff account.</p>

        <form id="loginForm">
          <label for="email">Email</label>
          <input id="email" type="email" required autocomplete="email" />

          <label for="password">Password</label>
          <input id="password" type="password" required autocomplete="current-password" />

          <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Sign in</button>
        </form>

        <div id="errorBox" class="error-msg hidden"></div>

        <p class="muted" style="margin-top:20px;">
          New here? <a href="/register.html">Create a member account</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    function routeAfterLogin(user) {
      if (user.must_change_password) { window.location.href = '/account.html?forced=1'; return; }
      if (Auth.hasAnyRole(user, ['member'])) {
        window.location.href = user.verification_status === 'approved' ? '/dashboard.html' : '/pending.html';
      } else {
        window.location.href = '/staff.html';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errorBox = document.getElementById('errorBox');
      errorBox.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const data = await api('/auth/login', { method: 'POST', body: { email, password } });
        Auth.setSession(data.token, data.user);
        routeAfterLogin(data.user);
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });

    (function () {
      const user = Auth.getUser();
      if (user && Auth.getToken()) routeAfterLogin(user);
    })();
  </script>
</body>
</html>
