<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Account settings — Sasa Loan</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">Sasa <span class="mark">Loan</span></div>
    <nav>
      <span class="user-chip" id="userChip"></span>
      <a href="#" id="backLink">Back</a>
      <a href="#" onclick="logout()">Sign out</a>
    </nav>
  </div>

  <div class="wrap narrow">
    <h1>Change password</h1>
    <div id="forcedNotice" class="panel hidden" style="margin-bottom:16px; border-color: var(--amber); background: var(--amber-bg);">
      <strong>You must set a new password before continuing.</strong>
      <p class="muted" style="margin:6px 0 0;">Your account was created with a temporary password. Please choose your own before you can use the rest of the app.</p>
    </div>
    <div class="panel">
      <form id="pwForm">
        <label for="current_password">Current password</label>
        <input id="current_password" type="password" required autocomplete="current-password" />

        <label for="new_password">New password</label>
        <input id="new_password" type="password" required minlength="6" autocomplete="new-password" />

        <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Update password</button>
      </form>
      <div id="errorBox" class="error-msg hidden"></div>
      <div id="successBox" class="success-msg hidden"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // Bypass the forced-password redirect here specifically, since this IS the
    // page that resolves it - otherwise a forced user could never reach it.
    const user = Auth.getUser();
    const token = Auth.getToken();
    if (!token || !user) window.location.href = '/index.html';

    const isForced = new URLSearchParams(window.location.search).get('forced') === '1' || (user && user.must_change_password);
    if (isForced) {
      document.getElementById('forcedNotice').classList.remove('hidden');
      document.getElementById('backLink').classList.add('hidden');
    } else {
      document.getElementById('backLink').href = Auth.hasAnyRole(user, ['member']) ? '/dashboard.html' : '/staff.html';
    }
    if (user) document.getElementById('userChip').textContent = user.full_name;

    document.getElementById('pwForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errorBox = document.getElementById('errorBox');
      const successBox = document.getElementById('successBox');
      errorBox.classList.add('hidden');
      successBox.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Updating…';

      try {
        const body = {
          current_password: document.getElementById('current_password').value,
          new_password: document.getElementById('new_password').value,
        };
        await api('/auth/change-password', { method: 'POST', body });

        // Refresh cached user so must_change_password clears and routing works normally again
        const { user: fresh } = await api('/auth/me');
        Auth.setSession(Auth.getToken(), fresh);

        if (isForced) {
          successBox.textContent = 'Password updated. Redirecting…';
          successBox.classList.remove('hidden');
          setTimeout(() => {
            window.location.href = Auth.hasAnyRole(fresh, ['member']) ? '/dashboard.html' : '/staff.html';
          }, 900);
        } else {
          successBox.textContent = 'Password updated.';
          successBox.classList.remove('hidden');
          document.getElementById('pwForm').reset();
        }
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Update password';
      }
    });
  </script>
</body>
</html>
