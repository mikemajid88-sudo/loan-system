<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Apply for a loan — Sasa Loan</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">Sasa <span class="mark">Loan</span></div>
    <nav>
      <span class="user-chip" id="userChip"></span>
      <a href="/dashboard.html">My loans</a>
      <a href="#" onclick="logout()">Sign out</a>
    </nav>
  </div>

  <div class="wrap narrow">
    <div class="page-intro">
      <div class="eyebrow">New application</div>
      <h1>Apply for a loan</h1>
      <p class="muted">Review the repayment estimate before submitting.</p>
    </div>
    <div class="panel">
      <form id="applyForm">
        <label for="amount" id="amountLabel">Loan amount (KES)</label>
        <input id="amount" type="number" step="100" required />

        <label for="guarantor_id">Guarantor</label>
        <select id="guarantor_id" required>
          <option value="">Loading…</option>
        </select>
        <p class="muted" style="margin-top:4px; font-size:12px;">Your guarantor must log in and approve before your application moves forward.</p>

        <label for="disbursement_date">When do you want the money?</label>
        <input id="disbursement_date" type="date" required />
        <p class="muted" style="margin-top:4px; font-size:12px;" id="dueDateHint"></p>

        <label for="purpose">Purpose of loan</label>
        <textarea id="purpose" placeholder="e.g. Stock for my shop, school fees, medical bill…"></textarea>

        <div id="calcPreview" class="hidden panel" style="margin-top:18px; padding:16px; background:#F8FAFC;"></div>

        <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Submit application</button>
      </form>
      <div id="errorBox" class="error-msg hidden"></div>
      <div id="successBox" class="success-msg hidden"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const user = Auth.requireRole(['member']);
    if (user) document.getElementById('userChip').textContent = user.full_name;

    const amountEl = document.getElementById('amount');
    const dateEl = document.getElementById('disbursement_date');
    const preview = document.getElementById('calcPreview');
    let calcTimer;
    let termDays = 30;

    // Minimum disbursement date is today
    const todayStr = new Date().toISOString().slice(0, 10);
    dateEl.min = todayStr;
    dateEl.value = todayStr;

    async function init() {
      try {
        const settings = await getSettings();
        termDays = Number(settings.loan_term_days || 30);
        document.getElementById('amountLabel').textContent =
          `Loan amount (KES ${Number(settings.min_loan_amount).toLocaleString()} - ${Number(settings.max_loan_amount).toLocaleString()})`;
        amountEl.min = settings.min_loan_amount;
        amountEl.max = settings.max_loan_amount;
      } catch (e) { /* fall back to defaults already in the label */ }

      try {
        const { users } = await api('/auth/verified-members');
        const select = document.getElementById('guarantor_id');
        if (users.length === 0) {
          select.innerHTML = `<option value="">No other verified users yet</option>`;
        } else {
          select.innerHTML = `<option value="">Select a guarantor…</option>` +
            users.map(u => `<option value="${u.id}">${u.full_name} (${u.phone})</option>`).join('');
        }
      } catch (e) {
        document.getElementById('guarantor_id').innerHTML = `<option value="">Could not load users</option>`;
      }

      updateDueHint();
    }

    function updateDueHint() {
      if (!dateEl.value) return;
      const d = new Date(dateEl.value + 'T00:00:00Z');
      d.setUTCDate(d.getUTCDate() + termDays);
      document.getElementById('dueDateHint').textContent =
        `Your loan will be due in full on ${d.toISOString().slice(0, 10)} (${termDays} days from disbursement).`;
    }
    dateEl.addEventListener('change', updateDueHint);

    function scheduleCalc() {
      clearTimeout(calcTimer);
      calcTimer = setTimeout(runCalc, 350);
    }
    async function runCalc() {
      const amount = Number(amountEl.value);
      if (!amount) { preview.classList.add('hidden'); return; }
      try {
        const calc = await api(`/loans/calculate?amount=${amount}`);
        preview.classList.remove('hidden');
        preview.innerHTML = `
          <strong>Estimated repayment</strong> (${calc.interest_rate}% flat over ${calc.term_days} days)<br/>
          Interest: KES ${money(calc.interest)}<br/>
          Total repayable: <strong>KES ${money(calc.totalRepayable)}</strong>
        `;
      } catch (e) { /* ignore preview errors */ }
    }
    amountEl.addEventListener('input', scheduleCalc);

    document.getElementById('applyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errorBox = document.getElementById('errorBox');
      const successBox = document.getElementById('successBox');
      errorBox.classList.add('hidden');
      successBox.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Submitting…';

      try {
        const body = {
          amount: Number(amountEl.value),
          guarantor_id: Number(document.getElementById('guarantor_id').value),
          disbursement_date: dateEl.value,
          purpose: document.getElementById('purpose').value.trim(),
        };
        if (!body.guarantor_id) throw new Error('Please select a guarantor');
        const data = await api('/loans/apply', { method: 'POST', body });
        successBox.textContent = 'Application submitted. Your guarantor can now see and approve it in their dashboard.';
        successBox.classList.remove('hidden');
        setTimeout(() => { window.location.href = `/loan.html?id=${data.loan.id}`; }, 1200);
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Submit application';
      }
    });

    init();
  </script>
</body>
</html>
