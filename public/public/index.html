<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Northgate Loans</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="center-page">
    <div class="wrap narrow">
      <div class="panel">
        <div class="eyebrow">Northgate Loans</div>
        <h1 style="margin-top:0;">Sign in</h1>
        <p class="muted">Borrowers and staff both sign in here.</p>

        <form id="loginForm">
          <label for="email">Email</label>
          <input id="email" type="email" required autocomplete="email" />

          <label for="password">Password</label>
          <input id="password" type="password" required autocomplete="current-password" />

          <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Sign in</button>
        </form>

        <div id="errorBox" class="error-msg hidden"></div>

        <p class="muted" style="margin-top:20px;">
          New borrower? <a href="/register.html">Create an account</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errorBox = document.getElementById('errorBox');
      errorBox.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const data = await api('/auth/login', { method: 'POST', body: { email, password } });
        Auth.setSession(data.token, data.user);
        window.location.href = data.user.role === 'borrower' ? '/dashboard.html' : '/staff.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });

    // If already logged in, skip straight to the right dashboard
    (function () {
      const user = Auth.getUser();
      if (user && Auth.getToken()) {
        window.location.href = user.role === 'borrower' ? '/dashboard.html' : '/staff.html';
      }
    })();
  </script>
</body>
</html>
