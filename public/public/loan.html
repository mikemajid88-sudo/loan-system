<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loan detail — Northgate Loans</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">Northgate <span class="mark">Loans</span></div>
    <nav>
      <span class="user-chip" id="userChip"></span>
      <a href="#" id="backLink">Back</a>
      <a href="#" onclick="logout()">Sign out</a>
    </nav>
  </div>

  <div class="wrap">
    <div id="content"><p class="muted">Loading…</p></div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const user = Auth.requireRole(['borrower', 'staff', 'admin']);
    if (user) document.getElementById('userChip').textContent = user.full_name;
    document.getElementById('backLink').href = user.role === 'borrower' ? '/dashboard.html' : '/staff.html';

    const params = new URLSearchParams(window.location.search);
    const loanId = params.get('id');

    async function load() {
      const content = document.getElementById('content');
      try {
        const { loan, events } = await api(`/loans/${loanId}`);
        const isStaff = ['staff', 'admin'].includes(user.role);

        let actions = '';
        if (isStaff) {
          if (loan.status === 'pending') {
            actions += `<button class="btn btn-outline" onclick="vet()">Send for vetting</button>`;
          }
          if (['pending', 'under_review'].includes(loan.status)) {
            actions += `<button class="btn btn-primary" onclick="approve()">Approve</button>`;
            actions += `<button class="btn btn-danger" onclick="reject()">Reject</button>`;
          }
          if (loan.status === 'approved') {
            actions += `<button class="btn btn-amber" onclick="disburse()">Mark as disbursed</button>`;
          }
        }

        content.innerHTML = `
          <div class="row-flex" style="justify-content:space-between; margin-bottom:20px;">
            <h1 style="margin:0;">Loan #${loan.id}</h1>
            ${badge(loan.status)}
          </div>

          <div class="panel" style="margin-bottom:20px;">
            <h3 style="margin-top:0;">Applicant</h3>
            <p><strong>${loan.full_name}</strong><br/>
            ${loan.email}${loan.phone ? ' · ' + loan.phone : ''}${loan.national_id ? ' · ID ' + loan.national_id : ''}</p>
          </div>

          <div class="panel" style="margin-bottom:20px;">
            <h3 style="margin-top:0;">Loan details</h3>
            <div class="field-row">
              <div><span class="muted">Amount requested</span><br/><strong>KES ${money(loan.amount)}</strong></div>
              <div><span class="muted">Term</span><br/><strong>${loan.term_months} months</strong></div>
              <div><span class="muted">Interest rate</span><br/><strong>${loan.interest_rate}% p.a.</strong></div>
              <div><span class="muted">Monthly payment</span><br/><strong>KES ${money(loan.monthly_payment)}</strong></div>
              <div><span class="muted">Total repayable</span><br/><strong>KES ${money(loan.total_repayable)}</strong></div>
              <div><span class="muted">Applied on</span><br/><strong>${fmtDate(loan.created_at)}</strong></div>
            </div>
            ${loan.purpose ? `<p style="margin-top:16px;"><span class="muted">Purpose:</span><br/>${loan.purpose}</p>` : ''}
            ${loan.staff_notes ? `<p style="margin-top:16px;"><span class="muted">Staff notes:</span><br/>${loan.staff_notes}</p>` : ''}
          </div>

          ${isStaff && actions ? `
            <div class="panel" style="margin-bottom:20px;">
              <h3 style="margin-top:0;">Actions</h3>
              <div class="row-flex">${actions}</div>
              <div id="errorBox" class="error-msg hidden"></div>
            </div>` : ''}

          <div class="panel">
            <h3 style="margin-top:0;">History</h3>
            <table>
              <thead><tr><th>Date</th><th>Action</th><th>Note</th></tr></thead>
              <tbody>
                ${events.map(ev => `
                  <tr>
                    <td>${fmtDate(ev.created_at)}</td>
                    <td>${ev.action.replace('_',' ')}</td>
                    <td>${ev.note || '—'}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
        `;
      } catch (err) {
        content.innerHTML = `<div class="error-msg">${err.message}</div>`;
      }
    }

    function showErr(msg) {
      const box = document.getElementById('errorBox');
      if (box) { box.textContent = msg; box.classList.remove('hidden'); }
    }

    async function vet() {
      const note = prompt('Add a vetting note (optional):') || '';
      try { await api(`/loans/${loanId}/vet`, { method: 'POST', body: { note } }); load(); }
      catch (e) { showErr(e.message); }
    }
    async function approve() {
      const note = prompt('Add an approval note (optional):') || '';
      if (!confirm('Approve this loan?')) return;
      try { await api(`/loans/${loanId}/approve`, { method: 'POST', body: { note } }); load(); }
      catch (e) { showErr(e.message); }
    }
    async function reject() {
      const note = prompt('Reason for rejection (required):');
      if (!note) return;
      try { await api(`/loans/${loanId}/reject`, { method: 'POST', body: { note } }); load(); }
      catch (e) { showErr(e.message); }
    }
    async function disburse() {
      if (!confirm('Mark this loan as disbursed?')) return;
      try { await api(`/loans/${loanId}/disburse`, { method: 'POST' }); load(); }
      catch (e) { showErr(e.message); }
    }

    load();
  </script>
</body>
</html>
