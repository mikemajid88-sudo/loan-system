<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loan detail — Sasa Loan</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">Sasa <span class="mark">Loan</span></div>
    <nav>
      <span class="user-chip" id="userChip"></span>
      <a href="#" id="backLink">Back</a>
      <a href="#" onclick="logout()">Sign out</a>
    </nav>
  </div>

  <div class="wrap">
    <div id="content"><p class="muted">Loading…</p></div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const user = Auth.requireRole(['member','loan_officer','credit_manager','admin','super_admin']);
    if (user) document.getElementById('userChip').textContent = user.full_name;
    document.getElementById('backLink').href = Auth.hasAnyRole(user, ['member']) ? '/dashboard.html' : '/staff.html';

    const params = new URLSearchParams(window.location.search);
    const loanId = params.get('id');

    const STATUS_LABELS = {
      awaiting_guarantor: 'Awaiting guarantor approval',
      pending_level1: 'Level 1 review pending',
      pending_level2: 'Level 2 review pending',
      approved: 'Approved — awaiting disbursement',
      rejected: 'Rejected',
      disbursed: 'Active (disbursed)',
      repaid: 'Repaid',
      defaulted: 'Overdue / defaulted',
    };

    async function load() {
      const content = document.getElementById('content');
      try {
        const { loan, events, extensions, repayments } = await api(`/loans/${loanId}`);
        const isLoanOfficer = Auth.hasAnyRole(user, ['loan_officer']);
        const isCreditManager = Auth.hasAnyRole(user, ['credit_manager']);
        const isStaff = Auth.hasAnyRole(user, ['loan_officer','credit_manager','admin','super_admin']);
        const isOwner = user.id === loan.user_id;
        const isGuarantor = user.id === loan.guarantor_id;

        let actions = '';
        if (isLoanOfficer && loan.status === 'pending_level1') {
          actions += `
            <button class="btn btn-primary" onclick="level1('passed')">Pass Level 1</button>
            <button class="btn btn-danger" onclick="level1('rejected')">Reject</button>`;
        }
        if (isCreditManager && loan.status === 'pending_level2') {
          actions += `
            <button class="btn btn-primary" onclick="level2('passed')">Pass Level 2</button>
            <button class="btn btn-danger" onclick="level2('rejected')">Reject</button>`;
        }
        if (isCreditManager && loan.status === 'approved') {
          actions += `<button class="btn btn-amber" onclick="disburse()">Mark as disbursed</button>`;
        }
        if (isGuarantor && loan.guarantor_status === 'pending') {
          actions += `
            <button class="btn btn-primary" onclick="guarantorRespond('approved')">Approve as guarantor</button>
            <button class="btn btn-outline" onclick="guarantorRespond('declined')">Decline</button>`;
        }

        // WhatsApp push buttons - available to any staff-side role, contextual to loan stage
        let waButtons = '';
        if (isStaff && loan.guarantor_status === 'pending' && loan.guarantor_phone) {
          waButtons += `<button class="btn btn-outline" onclick="pushGuarantorNotice()">📱 Notify guarantor</button>`;
        }
        if (isStaff && loan.status === 'approved') {
          waButtons += `<button class="btn btn-outline" onclick="pushApprovalMessage()">📱 Send approval message</button>`;
        }
        if (isStaff && loan.status === 'disbursed') {
          waButtons += `<button class="btn btn-outline" onclick="pushDisbursementMessage()">📱 Send disbursement notice</button>`;
        }
        if (isStaff && loan.status === 'defaulted' && loan.guarantor_phone) {
          waButtons += `<button class="btn btn-outline" onclick="pushGuarantorLiabilityNotice()">📱 Notify guarantor of liability</button>`;
        }

        const pendingExt = extensions.find(e => e.status === 'pending');
        let extensionBox = '';
        if (isOwner && ['disbursed', 'defaulted'].includes(loan.status) && !pendingExt) {
          extensionBox = `
            <div class="panel" style="margin-bottom:20px;">
              <h3 style="margin-top:0;">Need more time?</h3>
              <p class="muted">Submit a written request to run this loan for another ${loan.term_days} days. Staff will review it.</p>
              <textarea id="extReason" placeholder="Explain why you need an extension…"></textarea>
              <button class="btn btn-outline" style="margin-top:10px;" onclick="requestExtension()">Request extension</button>
            </div>`;
        }
        if (isStaff && pendingExt) {
          extensionBox = `
            <div class="panel" style="margin-bottom:20px; border-color: var(--amber);">
              <h3 style="margin-top:0;">Pending extension request</h3>
              <p>${pendingExt.reason}</p>
              <div class="row-flex" style="flex-wrap:wrap;">
                <button class="btn btn-primary" onclick="reviewExtension(${pendingExt.id}, 'approved')">Approve extension</button>
                <button class="btn btn-danger" onclick="reviewExtension(${pendingExt.id}, 'rejected')">Reject</button>
              </div>
            </div>`;
        }
        if (isStaff && extensions.some(e => e.status === 'approved') && loan.status === 'disbursed') {
          const lastApproved = extensions.find(e => e.status === 'approved');
          waButtons += `<button class="btn btn-outline" onclick="pushExtensionMessage('${lastApproved.new_due_date}')">📱 Send extension confirmation</button>`;
        }

        // Repayment recording form - Credit Manager only, while loan is disbursed/overdue
        let repaymentBox = '';
        if (isCreditManager && ['disbursed', 'defaulted'].includes(loan.status)) {
          repaymentBox = `
            <div class="panel" style="margin-bottom:20px;">
              <h3 style="margin-top:0;">Record a repayment</h3>
              <p class="muted">Outstanding balance: <strong>KES ${money(loan.balance)}</strong></p>
              <label for="repayAmount">Amount received (KES)</label>
              <input id="repayAmount" type="number" step="0.01" min="0.01" max="${loan.balance}" />
              <label for="repayNote">Note (optional)</label>
              <input id="repayNote" placeholder="e.g. M-Pesa, cash, reference number" />
              <button class="btn btn-primary" style="margin-top:12px;" onclick="recordRepayment(${loan.balance})">Record repayment</button>
            </div>`;
        }

        content.innerHTML = `
          <div class="row-flex" style="justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:8px;">
            <h1 style="margin:0;">Loan #${loan.id}</h1>
            ${countdownPill(loan.days_remaining, loan.status)}
          </div>
          <p class="muted" style="margin-top:-14px;">${STATUS_LABELS[loan.status] || loan.status}</p>

          <div class="grid-2" style="margin-bottom:20px;">
            <div class="panel">
              <h3 style="margin-top:0;">Applicant</h3>
              <p><strong>${loan.full_name}</strong><br/>${loan.email} · ${loan.phone}${loan.national_id ? ' · ID ' + loan.national_id : ''}</p>
            </div>
            <div class="panel">
              <h3 style="margin-top:0;">Guarantor</h3>
              <p><strong>${loan.guarantor_name || '—'}</strong> ${loan.guarantor_phone ? '· ' + loan.guarantor_phone : ''}<br/>
              ${badge(loan.guarantor_status === 'approved' ? 'approved' : loan.guarantor_status === 'declined' ? 'rejected' : 'pending')}</p>
              ${loan.guarantor_liability_amount ? `<p class="muted" style="margin-top:8px; font-size:13px;">Liable for up to <strong>KES ${money(loan.guarantor_liability_amount)}</strong> if this loan defaults.</p>` : ''}
            </div>
          </div>

          <div class="panel" style="margin-bottom:20px;">
            <h3 style="margin-top:0;">Loan statement</h3>
            <div class="field-row">
              <div><span class="muted">Amount</span><br/><strong>KES ${money(loan.amount)}</strong></div>
              <div><span class="muted">Interest rate</span><br/><strong>${loan.interest_rate}% flat</strong></div>
              <div><span class="muted">Total repayable</span><br/><strong>KES ${money(loan.total_repayable)}</strong></div>
              <div><span class="muted">Amount paid</span><br/><strong style="color: var(--green);">KES ${money(loan.amount_paid)}</strong></div>
              <div><span class="muted">Balance</span><br/><strong style="color: ${loan.balance > 0 ? 'var(--red)' : 'var(--green)'};">KES ${money(loan.balance)}</strong></div>
              <div><span class="muted">Due date</span><br/><strong>${loan.due_date}</strong></div>
            </div>
            ${loan.purpose ? `<p style="margin-top:16px;"><span class="muted">Purpose:</span><br/>${loan.purpose}</p>` : ''}
            ${repayments.length > 0 ? `
              <table style="margin-top:16px;">
                <thead><tr><th>Date</th><th>Amount</th><th>Note</th><th>Recorded by</th></tr></thead>
                <tbody>
                  ${repayments.map(r => `
                    <tr>
                      <td data-label="Date">${fmtDate(r.created_at)}</td>
                      <td data-label="Amount">KES ${money(r.amount)}</td>
                      <td data-label="Note">${r.note || '—'}</td>
                      <td data-label="Recorded by">${r.recorded_by_name || '—'}</td>
                    </tr>`).join('')}
                </tbody>
              </table>` : ''}
          </div>

          ${repaymentBox}

          <div class="panel" style="margin-bottom:20px;">
            <h3 style="margin-top:0;">Approval trail</h3>
            <p><strong>Level 1 (Loan Officer):</strong> ${loan.level1_status}${loan.level1_note ? ' — ' + loan.level1_note : ''}</p>
            <p><strong>Level 2 (Credit Manager):</strong> ${loan.level2_status}${loan.level2_note ? ' — ' + loan.level2_note : ''}</p>
          </div>

          ${extensionBox}

          ${actions || waButtons ? `
            <div class="panel" style="margin-bottom:20px;">
              <h3 style="margin-top:0;">Actions</h3>
              <div class="row-flex" style="flex-wrap:wrap;">${actions}</div>
              ${waButtons ? `<div class="row-flex" style="flex-wrap:wrap; margin-top:${actions ? '12px' : '0'};">${waButtons}</div>` : ''}
              <div id="errorBox" class="error-msg hidden"></div>
            </div>` : ''}

          <div class="panel">
            <h3 style="margin-top:0;">History</h3>
            <table>
              <thead><tr><th>Date</th><th>Action</th><th>Note</th></tr></thead>
              <tbody>
                ${events.map(ev => `
                  <tr>
                    <td data-label="Date">${fmtDate(ev.created_at)}</td>
                    <td data-label="Action">${ev.action.replace(/_/g,' ')}</td>
                    <td data-label="Note">${ev.note || '—'}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
        `;

        window._loan = loan; // stash for whatsapp button handlers
      } catch (err) {
        content.innerHTML = `<div class="error-msg">${err.message}</div>`;
      }
    }

    function showErr(msg) {
      const box = document.getElementById('errorBox');
      if (box) { box.textContent = msg; box.classList.remove('hidden'); }
      else alert(msg);
    }

    async function level1(decision) {
      const note = prompt('Add a note (optional):') || '';
      try { await api(`/loans/${loanId}/level1`, { method: 'POST', body: { decision, note } }); load(); }
      catch (e) { showErr(e.message); }
    }
    async function level2(decision) {
      const note = prompt('Add a note (optional):') || '';
      try { await api(`/loans/${loanId}/level2`, { method: 'POST', body: { decision, note } }); load(); }
      catch (e) { showErr(e.message); }
    }
    async function disburse() {
      if (!confirm('Mark this loan as disbursed?')) return;
      try { await api(`/loans/${loanId}/disburse`, { method: 'POST' }); load(); }
      catch (e) { showErr(e.message); }
    }
    async function recordRepayment(maxBalance) {
      const amount = Number(document.getElementById('repayAmount').value);
      const note = document.getElementById('repayNote').value.trim();
      if (!amount || amount <= 0) { showErr('Enter a valid amount'); return; }
      if (amount > maxBalance) { showErr(`Amount exceeds the outstanding balance of KES ${money(maxBalance)}`); return; }
      try {
        const result = await api(`/loans/${loanId}/repayments`, { method: 'POST', body: { amount, note } });
        if (result.fully_paid) alert('Loan fully repaid!');
        load();
      } catch (e) { showErr(e.message); }
    }
    async function guarantorRespond(decision) {
      if (decision === 'declined' && !confirm('Decline this guarantor request?')) return;
      try { await api(`/loans/${loanId}/guarantor-respond`, { method: 'POST', body: { decision } }); load(); }
      catch (e) { showErr(e.message); }
    }
    async function requestExtension() {
      const reason = document.getElementById('extReason').value.trim();
      if (!reason) { alert('Please explain why you need an extension'); return; }
      try { await api(`/loans/${loanId}/request-extension`, { method: 'POST', body: { reason } }); load(); }
      catch (e) { alert(e.message); }
    }
    async function reviewExtension(extId, decision) {
      const note = prompt(`Note for ${decision === 'approved' ? 'approving' : 'rejecting'} this extension (optional):`) || '';
      try { await api(`/loans/extensions/${extId}/review`, { method: 'POST', body: { decision, note } }); load(); }
      catch (e) { showErr(e.message); }
    }

    function pushGuarantorNotice() {
      const loan = window._loan;
      const msg = `Dear ${loan.guarantor_name}, ${loan.full_name} has listed you as guarantor for a Sasa Loan of KES ${loan.amount}. Please log in to Sasa Loan to approve or decline.`;
      pushWhatsApp(loan.guarantor_phone, msg, loan.id);
    }
    function pushApprovalMessage() {
      const loan = window._loan;
      const msg = `Dear ${loan.full_name}, your loan has been approved and will be disbursed shortly.`;
      pushWhatsApp(loan.phone, msg, loan.id);
    }
    function pushDisbursementMessage() {
      const loan = window._loan;
      const msg = `Dear ${loan.full_name}, your Sasa Loan of KES ${loan.amount} has been disbursed. Repayment of KES ${loan.total_repayable} is due by ${loan.due_date}.`;
      pushWhatsApp(loan.phone, msg, loan.id);
    }
    function pushExtensionMessage(newDueDate) {
      const loan = window._loan;
      const msg = `Dear ${loan.full_name}, your extension request has been approved. New amount due: KES ${loan.total_repayable}, new due date: ${newDueDate}.`;
      pushWhatsApp(loan.phone, msg, loan.id);
    }
    function pushGuarantorLiabilityNotice() {
      const loan = window._loan;
      const msg = `Dear ${loan.guarantor_name}, ${loan.full_name}'s Sasa Loan of KES ${loan.amount} is now overdue. As guarantor, you are liable for up to KES ${loan.guarantor_liability_amount}. Please contact us to discuss.`;
      pushWhatsApp(loan.guarantor_phone, msg, loan.id);
    }

    load();
  </script>
</body>
</html>
