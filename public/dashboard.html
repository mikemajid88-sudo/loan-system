<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My loans — Sasa Loan</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">Sasa <span class="mark">Loan</span></div>
    <nav>
      <span class="user-chip" id="userChip"></span>
      <a href="/account.html">Account</a>
      <a href="#" onclick="logout()">Sign out</a>
    </nav>
  </div>

  <div class="wrap">
    <div id="guarantorSection"></div>

    <div class="row-flex" style="justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap:10px;">
      <h1 style="margin:0;">My loans</h1>
      <a href="/apply.html" class="btn btn-amber hidden" id="applyBtn">Apply for a loan</a>
    </div>

    <div id="content">
      <p class="muted">Loading…</p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const user = Auth.requireRole(['member']);
    if (user) document.getElementById('userChip').textContent = user.full_name;

    function statusLabel(l) {
      const map = {
        awaiting_guarantor: 'Awaiting guarantor',
        pending_level1: 'Under review (1/2)',
        pending_level2: 'Under review (2/2)',
        approved: 'Approved — awaiting disbursement',
        rejected: 'Rejected',
        disbursed: 'Active',
        repaid: 'Repaid',
        defaulted: 'Overdue',
      };
      return map[l.status] || l.status;
    }

    async function loadGuarantorRequests() {
      const section = document.getElementById('guarantorSection');
      try {
        const { requests } = await api('/loans/guarantor-requests');
        if (requests.length === 0) { section.innerHTML = ''; return; }
        section.innerHTML = `
          <div class="panel" style="margin-bottom:24px; border-color: var(--amber);">
            <h3 style="margin-top:0;">Guarantor requests awaiting your response</h3>
            <div class="card-list">
              ${requests.map(r => `
                <div class="card-item">
                  <strong>${r.applicant_name}</strong> wants you as guarantor for a loan of KES ${money(r.amount)}
                  (repayable KES ${money(r.total_repayable)} by ${r.due_date}).
                  <div class="liability-notice">
                    ⚠️ If ${r.applicant_name} defaults on this loan, you will be liable to pay up to <strong>KES ${money(r.guarantor_liability_amount)}</strong> (50% of the loan amount).
                  </div>
                  <div class="row-flex" style="margin-top:10px;">
                    <button class="btn btn-primary" onclick="respond(${r.id}, 'approved', ${r.guarantor_liability_amount})">Approve</button>
                    <button class="btn btn-outline" onclick="respond(${r.id}, 'declined')">Decline</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>`;
      } catch (e) { /* non-fatal */ }
    }

    async function respond(loanId, decision, liabilityAmount) {
      if (decision === 'declined' && !confirm('Decline this guarantor request?')) return;
      if (decision === 'approved' && !confirm(`By approving, you confirm you understand you are liable for up to KES ${money(liabilityAmount)} if this loan defaults. Continue?`)) return;
      try {
        await api(`/loans/${loanId}/guarantor-respond`, { method: 'POST', body: { decision } });
        loadGuarantorRequests();
      } catch (e) { alert(e.message); }
    }

    async function load() {
      const content = document.getElementById('content');
      try {
        const { loans } = await api('/loans/my');
        const applyBtn = document.getElementById('applyBtn');
        const hasOpen = loans.some(l => !['rejected', 'repaid'].includes(l.status));
        if (!hasOpen && user.verification_status === 'approved') {
          applyBtn.classList.remove('hidden');
        }

        if (loans.length === 0) {
          content.innerHTML = `
            <div class="panel empty-state">
              <h3>No loans yet</h3>
              <p>Apply for your first loan to get started.</p>
            </div>`;
          return;
        }

        content.innerHTML = `
          <div class="grid-auto">
            ${loans.map(l => `
              <div class="card-item clickable" onclick="window.location.href='/loan.html?id=${l.id}'">
                <div class="row-flex" style="justify-content:space-between;">
                  <strong>KES ${money(l.amount)}</strong>
                  ${countdownPill(l.days_remaining, l.status)}
                </div>
                <div class="muted" style="margin-top:6px; font-size:13px;">
                  ${statusLabel(l)} · Applied ${fmtDate(l.created_at)}
                </div>
                ${l.status === 'disbursed' || l.status === 'defaulted' ? `<div style="margin-top:6px; font-size:13px;">Due ${l.due_date} · Repay KES ${money(l.total_repayable)}</div>` : ''}
              </div>
            `).join('')}
          </div>`;
      } catch (err) {
        content.innerHTML = `<div class="error-msg">${err.message}</div>`;
      }
    }
    loadGuarantorRequests();
    load();
  </script>
</body>
</html>
